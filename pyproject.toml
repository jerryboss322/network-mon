[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse-network-mon"
version = "2.0.0"
description = "Enterprise Network & Infrastructure Observability Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "jerryboss322"}]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "psutil>=5.9.8",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "websockets>=12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
